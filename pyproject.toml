[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-toolkit"
version = "1.0.0"
description = "SDK para criação simplificada de MCP Servers em Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Empresa", email = "dev@empresa.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "ai",
    "agents",
    "tools",
    "sdk"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
    "structlog>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
openapi = [
    "openapi-spec-validator>=0.6.0",
]
metrics = [
    "prometheus-client>=0.17.0",
]
http2 = [
    "httpx[http2]>=0.25.0",
]
all = [
    "mcp-toolkit[dev,openapi,metrics,http2]",
]

[project.scripts]
mcp-toolkit = "mcp_toolkit.cli:main"

[project.urls]
Documentation = "https://github.com/empresa/mcp-toolkit#readme"
Repository = "https://github.com/empresa/mcp-toolkit"
Issues = "https://github.com/empresa/mcp-toolkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["mcp_toolkit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
